services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-anco}
      POSTGRES_USER: ${POSTGRES_USER:-anco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anco-dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-anco} -d ${POSTGRES_DB:-anco}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    volumes:
      - ..:/app
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - internal

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    command: python manage.py qcluster
    env_file:
      - ../.env
    volumes:
      - ..:/app
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - internal
    profiles:
      - worker  # opcional em dev (tasks rodam sync); ligar com --profile worker

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      ANCO_DOMAIN: ${ANCO_DOMAIN:-anco.paulovicente.pro.br}
      ANCO_ADMIN_EMAIL: ${ANCO_ADMIN_EMAIL:-paulovicente.ifba@gmail.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../staticfiles:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    networks:
      - internal
    profiles:
      - prod  # so sobe em producao (`--profile prod`); dev usa :8000 direto

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  internal:
