services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-anco}
      POSTGRES_USER: ${POSTGRES_USER:-anco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anco-dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-anco} -d ${POSTGRES_DB:-anco}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    volumes:
      - ..:/app
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - internal

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    command: python manage.py qcluster
    env_file:
      - ../.env
    volumes:
      - ..:/app
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - internal
    profiles:
      - worker  # opcional em dev (tasks rodam sync); ligar com --profile worker

volumes:
  pgdata:

networks:
  internal:
