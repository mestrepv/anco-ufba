{# Uso: {% include "partials/_chip.html" with label="Empirismo" removable=True %} #}
{# removable=True adiciona botão ×                                               #}
<span class="chip{% if removable %} chip-removable{% endif %}">
  {{ label }}
  {% if removable %}
  <button type="button"
          class="x"
          style="background:none;border:0;padding:0;cursor:pointer;color:var(--color-ink-3);line-height:1;font-size:12px;"
          aria-label="Remover {{ label }}">
    <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3" style="width:10px;height:10px;" aria-hidden="true">
      <line x1="3" y1="3" x2="9" y2="9" stroke-linecap="round"/>
      <line x1="9" y1="3" x2="3" y2="9" stroke-linecap="round"/>
    </svg>
  </button>
  {% endif %}
</span>
